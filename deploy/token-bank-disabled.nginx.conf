# Temporary C-end Token Bank shutdown; remove include only after the revised product is approved.
location = /token-bank { return 302 /dashboard; }
location ^~ /token-bank/ { return 302 /dashboard; }
location ~ ^/api/v1/(token-bank(/|$)|user/(accounts|token-bank|openai|gemini|kimi|antigravity|grok|cn-providers)(/|$)) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"code":503,"reason":"TOKEN_BANK_DISABLED","message":"Token Bank is temporarily unavailable"}';
}
